name: CI API
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, sqlite3, curl, dom, fileinfo, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Clear cached configuration
        run: php artisan config:clear
      - name: Validate per-environment JWT key provisioning
        run: |
          php -l scripts/ensure-jwt-keys.php
          php scripts/ensure-jwt-keys.php
          test -s storage/jwt/private.pem
          test -s storage/jwt/public.pem
          private_hash_before=$(sha256sum storage/jwt/private.pem | cut -d ' ' -f 1)
          php scripts/ensure-jwt-keys.php
          private_hash_after=$(sha256sum storage/jwt/private.pem | cut -d ' ' -f 1)
          test "$private_hash_before" = "$private_hash_after"
          test "$(stat -c '%a' storage/jwt/private.pem)" = "600"
          test "$(stat -c '%a' storage/jwt/public.pem)" = "644"
      - name: Run maternal workflow and SMS configuration tests
        run: php artisan test --filter='MaternalCareApiTest|TelerivetServiceConfigTest'
      - name: Legacy full-suite diagnostic (known pre-existing failures)
        continue-on-error: true
        run: php artisan test
