name: CI WEB
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint changed maternal workflow and auth types
        run: npx eslint 'src/app/agent/grossesses/[id]/page.tsx' 'src/app/agent/meres/[id]/page.tsx' src/app/agent/profil/page.tsx src/features/auth/useAuth.tsx
      - name: Build
        run: npm run build
