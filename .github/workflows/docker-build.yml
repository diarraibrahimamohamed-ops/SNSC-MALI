name: Docker Build
on: [push, pull_request]
jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Synthetic CI-only values; never use these in a deployed environment.
      POSTGRES_PASSWORD: ci-only-password-not-for-deployment
      AUDIT_LOGS_TOKEN: ci-only-audit-token
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API, web and IA images
        run: docker compose build --pull api web ia
