services:
  postgres:
    image: postgres:16
    container_name: vaccin_postgres
    environment:
      POSTGRES_DB: vaccin_track
      POSTGRES_USER: vaccin_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vaccin-network

  redis:
    image: redis:7
    container_name: vaccin_redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - vaccin-network

  api:
    build:
      context: ./apps/api
      dockerfile: docker/php/Dockerfile
    container_name: vaccin_api
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vaccin_track
      DB_USERNAME: vaccin_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      JWT_ALGO: ${JWT_ALGO:-RS256}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-file:///var/www/html/storage/jwt/public.pem}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-file:///var/www/html/storage/jwt/private.pem}
      JWT_TTL: ${JWT_TTL:-15}
      JWT_BLACKLIST_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: sh -c "composer install && (test -f .env || cp .env.example .env) && php scripts/ensure-jwt-keys.php && (grep -q '^APP_KEY=base64:' .env || php artisan key:generate) && php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - vaccin-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: vaccin_web
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    networks:
      - vaccin-network

  ia:
    build:
      context: ./apps/ia
      dockerfile: Dockerfile
    container_name: vaccin_ia
    working_dir: /app
    volumes:
      - ./apps/ia:/app
    environment:
      # Keep blank in local development to leave audit-log access disabled.
      # Set AUDIT_LOGS_TOKEN in the root .env before using /audit/logs.
      AUDIT_LOGS_TOKEN: ${AUDIT_LOGS_TOKEN:-}
    ports:
      - "8080:8080"
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    networks:
      - vaccin-network

volumes:
  postgres_data:

networks:
  vaccin-network:
    driver: bridge
